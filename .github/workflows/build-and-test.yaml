name: Build and Test

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Check out interop compiler
        uses: actions/checkout@v5
        with:
          repository: wstein/flix-fork
          ref: c981884efdc3fd55328ab5b1f75ce54b52856e3f
          path: flix-fork

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build interop compiler
        run: ./mill flix.assembly
        working-directory: flix-fork

      - name: Install Rewrite vendor jars
        run: ./vendor/setup-rewrite.sh

      - name: Check Gradle and packaged interop
        env:
          FLIX_FORK_JAR: ${{ github.workspace }}/flix-fork/out/flix/assembly.dest/out.jar
        run: |
          ./gradlew check --console=plain
          ./scripts/check-java-round-trip
