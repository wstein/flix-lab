"flixlab-jrubylib.jar" = "url:file:///Users/werner/github.com/wstein/flix-lab/vendor/jrubylib/flixlab-jrubylib.jar"
"flixlab-clojurelib.jar" = "url:file:///Users/werner/github.com/wstein/flix-lab/vendor/clojurelib/flixlab-clojurelib.jar"
"rewrite-core-0.1.0-SNAPSHOT.jar" = "url:file:///Users/werner/github.com/wstein/flix-lab/vendor/rewrite/rewrite-core-0.1.0-SNAPSHOT.jar"
"rewrite-java-0.1.0-SNAPSHOT.jar" = "url:file:///Users/werner/github.com/wstein/flix-lab/vendor/rewrite/rewrite-java-0.1.0-SNAPSHOT.jar"
