[package]
name        = "flix-lab"
description = "test"
version     = "0.1.0"
flix        = "0.75.1"
authors     = ["John Doe <john@example.com>"]

# Transitive dependencies of the vendored org.openrewrite jars below
# (see [jar-dependencies]), resolvable from Maven Central.
[mvn-dependencies]
"com.fasterxml.jackson.core:jackson-core" = "2.21.5"
"com.fasterxml.jackson.core:jackson-databind" = "2.21.5"
"com.fasterxml.jackson.core:jackson-annotations" = "2.21"
"com.fasterxml.jackson.dataformat:jackson-dataformat-smile" = "2.21.5"
"com.fasterxml.jackson.module:jackson-module-parameter-names" = "2.21.5"
"com.fasterxml.jackson.datatype:jackson-datatype-jsr310" = "2.21.5"
"org.jetbrains:annotations" = "26.1.0"
"org.jspecify:jspecify" = "1.0.0"
"org.ow2.asm:asm" = "9.10.1"
"org.ow2.asm:asm-util" = "9.10.1"
"org.ow2.asm:asm-tree" = "9.10.1"
"org.ow2.asm:asm-analysis" = "9.10.1"
"org.antlr:antlr4-runtime" = "4.13.2"
"org.apache.commons:commons-text" = "1.15.0"
"org.apache.commons:commons-lang3" = "3.19.0"
"io.github.classgraph:classgraph" = "4.8.184"
"io.micrometer:micrometer-core" = "1.9.17"
"org.yaml:snakeyaml" = "2.6"
"com.github.ben-manes.caffeine:caffeine" = "2.9.3"
"org.objenesis:objenesis" = "3.5"

# Runtime libraries for the non-Java Greeter siblings below (see [jar-dependencies]): each
# sibling's jar only holds its own compiled classes, so its language runtime has to be on Flix's
# classpath separately, the same way javalib's transitive deps above are.
"org.jetbrains.kotlin:kotlin-stdlib" = "2.4.10"
"org.scala-lang:scala3-library_3" = "3.8.4"
"org.apache.groovy:groovy" = "5.0.4"
"org.jruby:jruby-complete" = "10.0.4.0"
"org.clojure:clojure" = "1.12.6"

# Plain Java called from Main.flix, giving a debug session somewhere to step into. The Flix
# compiler does not compile .java sources, so src/javalib is packaged by Gradle's `javalibJar`
# task and put on the classpath here. That task generates compile-only @Export stubs first, then
# compiles Java against them and refreshes the project-local Flix cache. Rebuild with
# `./gradlew javalibJar` after editing the Java greeter or its exported Flix callback.
#
# The four jars below are Kotlin/Scala/Groovy/JRuby siblings of javalib's Greeter, one language per
# jar -- see src/kotlinlib, src/scalalib, src/groovylib, src/jrubylib and each language's own
# `*libJar` Gradle task. Rebuild all of them with `./gradlew kotlinlibJar scalalibJar groovylibJar
# jrubylibJar` after editing any of them.
#
# org.openrewrite:*:0.1.0-SNAPSHOT, a private fork not published to Maven
# Central. Vendored under vendor/rewrite/ -- see vendor/README.md.
[jar-dependencies]
"flixlab-javalib.jar" = "url:file:///Users/werner/github.com/wstein/flix-lab/vendor/javalib/flixlab-javalib.jar"
"flixlab-kotlinlib.jar" = "url:file:///Users/werner/github.com/wstein/flix-lab/vendor/kotlinlib/flixlab-kotlinlib.jar"
"flixlab-scalalib.jar" = "url:file:///Users/werner/github.com/wstein/flix-lab/vendor/scalalib/flixlab-scalalib.jar"
